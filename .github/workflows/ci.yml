name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v2

      - name: Strict build and link check
        run: mise run check
