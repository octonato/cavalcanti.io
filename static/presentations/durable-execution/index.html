<script>
// Wraps each line of every code block in a span, for line numbers.
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('section :is(pre, marp-pre) > code').forEach((code) => {
    const lines = code.innerHTML.replace(/\n$/, '').split('\n');
    code.innerHTML = lines.map((line) => `<span class="line">${line}</span>`).join('\n');
  });

  // Highlights the code line listed in data-lines for the current fragment.
  document.querySelectorAll('.highlight-steps').forEach((box) => {
    const targets = box.dataset.lines.split(' ').map(Number);
    const lines = box.querySelectorAll('code .line');
    const steps = [...box.querySelectorAll('[data-marpit-fragment]')];

    const update = () => {
      const active = steps.filter((s) => s.dataset.bespokeMarpFragment === 'active').length;
      const target = active > 0 ? targets[active - 1] : 0;
      lines.forEach((line, i) => line.classList.toggle('current', i + 1 === target));
    };

    new MutationObserver(update).observe(box, {
      subtree: true,
      attributes: true,
      attributeFilter: ['data-bespoke-marp-fragment'],
    });
  });

  // Shows under a diagram the caption of the last revealed arrow that has one.
  document.querySelectorAll('svg.flow + .flow-caption').forEach((caption) => {
    const svg = caption.previousElementSibling;
    const steps = [...svg.querySelectorAll('[data-caption]')];

    const update = () => {
      const shown = steps.filter((s) => s.dataset.bespokeMarpFragment === 'active');
      caption.textContent = shown.length > 0 ? shown.at(-1).dataset.caption : '';
    };

    new MutationObserver(update).observe(svg, {
      subtree: true,
      attributes: true,
      attributeFilter: ['data-bespoke-marp-fragment'],
    });
  });
});
</script>

<h2 id="orchestration">Orchestration</h2>
<div class="queue-demo orchestration" data-messages="circle square-o triangle circle-o square triangle-o circle-o">
  <div class="frame queue"><span>queue / partition / journal</span></div>
  <span class="step" data-marpit-fragment></span>
  <span class="step" data-marpit-fragment></span>
  <span class="step" data-marpit-fragment></span>
</div>
<script>
// Queue demos: each active fragment takes the head of the queue.
(() => {
  const PITCH = 150;
  const QUEUE_SIZE = 4;
  const ROW_Y = 80;
  const FRAME_TOP = ROW_Y - 50;
  const ENVELOPE_INSET = 65;

  const CONSUMER_X = 945;

  const STAGING_X = 880;
  const WORKFLOW_Y = 300;
  const WORKFLOW_X = [0, 440, 880];

  const SHAPES = {
    circle: '<circle cx="50" cy="50" r="40"/>',
    square: '<rect x="12" y="12" width="76" height="76" rx="6"/>',
    triangle: '<polygon points="50,8 92,88 8,88"/>',
  };

  const createMessage = (name) => {
    const [shape, outline] = name.split('-');
    const msg = document.createElement('div');
    msg.className = outline ? 'msg outline' : 'msg';
    msg.innerHTML = `<svg viewBox="0 0 100 100">${SHAPES[shape]}</svg>`;
    return msg;
  };

  const createWorkflow = () => {
    const wf = document.createElement('div');
    wf.className = 'frame workflow';
    wf.innerHTML = '<span>workflow</span>';
    return wf;
  };

  // Position 0 is the tail, QUEUE_SIZE - 1 the head. Below 0: not arrived. Above: taken.
  const positionOf = (index, taken) => QUEUE_SIZE - 1 - index + taken;

  const moveTo = (el, x, y) => {
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
  };

  const show = (el, visible) => {
    el.style.opacity = visible ? 1 : 0;
    el.style.transform = visible ? 'none' : 'scale(0.2)';
  };

  const placeInQueue = (msg, pos) => {
    moveTo(msg, Math.max(pos, 0) * PITCH, ROW_Y);
    show(msg, pos >= 0);
  };

  // Runs render or animate each time the number of active fragments changes.
  const drive = (demo, render, animate) => {
    const steps = [...demo.querySelectorAll('.step')];
    let state = 0;
    let timers = [];

    const later = (ms, fn) => timers.push(setTimeout(fn, ms));

    const renderStill = (taken) => {
      timers.forEach(clearTimeout);
      timers = [];

      demo.classList.add('still');
      render(taken);
      demo.offsetHeight;
      demo.classList.remove('still');
    };

    const onFragmentChange = () => {
      const next = steps.filter((s) => s.dataset.bespokeMarpFragment === 'active').length;
      if (next === state) return;

      if (next === state + 1) {
        renderStill(next - 1);
        animate(next, later);
      } else {
        renderStill(next);
      }
      state = next;
    };

    renderStill(0);
    new MutationObserver(onFragmentChange).observe(demo, {
      subtree: true,
      attributes: true,
      attributeFilter: ['data-bespoke-marp-fragment'],
    });
  };

  const setupChoreography = (demo, msgs) => {
    const offset = demo.querySelector('.offset-value');

    const render = (taken) => {
      msgs.forEach((msg, i) => {
        msg.classList.remove('processing', 'done');
        const pos = positionOf(i, taken);
        if (pos < QUEUE_SIZE) placeInQueue(msg, pos);
        else msg.style.opacity = 0;
      });
      offset.textContent = taken;
    };

    const animate = (taken, later) => {
      const head = msgs[taken - 1];
      moveTo(head, CONSUMER_X, ROW_Y);

      later(700, () => {
        head.classList.add('processing');
        msgs.forEach((msg, i) => {
          const pos = positionOf(i, taken);
          if (msg !== head && pos > 0 && pos < QUEUE_SIZE) placeInQueue(msg, pos);
        });
      });

      later(1300, () => {
        msgs.forEach((msg, i) => {
          if (positionOf(i, taken) === 0) placeInQueue(msg, 0);
        });
      });

      later(2300, () => {
        head.classList.replace('processing', 'done');
        offset.textContent = taken;
      });

      later(2900, () => {
        head.style.opacity = 0;
      });
    };

    drive(demo, render, animate);
  };

  const setupOrchestration = (demo, msgs) => {
    const workflows = WORKFLOW_X.map(createWorkflow);
    workflows.forEach((wf) => demo.appendChild(wf));

    const parkWorkflow = (wf, msg, slot) => {
      moveTo(wf, WORKFLOW_X[slot], WORKFLOW_Y);
      moveTo(msg, WORKFLOW_X[slot] + ENVELOPE_INSET, WORKFLOW_Y + 50);
    };

    const render = (taken) => {
      workflows.forEach((wf, j) => {
        if (j < taken) parkWorkflow(wf, msgs[j], j);
        else moveTo(wf, STAGING_X, FRAME_TOP);
        show(wf, j < taken);
      });

      msgs.forEach((msg, i) => {
        msg.classList.toggle('processing', i < taken);
        if (i < taken) show(msg, true);
        else placeInQueue(msg, positionOf(i, taken));
      });
    };

    const animate = (taken, later) => {
      const head = msgs[taken - 1];
      const wf = workflows[taken - 1];

      show(wf, true);

      later(500, () => {
        moveTo(head, STAGING_X + ENVELOPE_INSET, ROW_Y);
      });

      later(1100, () => {
        head.classList.add('processing');
        msgs.forEach((msg, i) => {
          const pos = positionOf(i, taken);
          if (msg !== head && pos > 0 && pos < QUEUE_SIZE) placeInQueue(msg, pos);
        });
      });

      later(1600, () => {
        parkWorkflow(wf, head, taken - 1);
      });

      later(1800, () => {
        msgs.forEach((msg, i) => {
          if (positionOf(i, taken) === 0) placeInQueue(msg, 0);
        });
      });
    };

    drive(demo, render, animate);
  };

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.queue-demo').forEach((demo) => {
      const msgs = demo.dataset.messages.split(' ').map(createMessage);
      msgs.forEach((msg) => demo.appendChild(msg));

      if (demo.classList.contains('orchestration')) setupOrchestration(demo, msgs);
      else setupChoreography(demo, msgs);
    });
  });
})();
</script>

<h2 id="restate-3">Restate</h2>
<div class="highlight-steps" data-lines="4 6 8 11 14">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Workflow</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">TransferState</span> <span class="hljs-title function_">run</span><span class="hljs-params">(Transfer transfer)</span> {
  <span class="hljs-type">var</span> <span class="hljs-variable">state</span> <span class="hljs-operator">=</span> TransferState.started(Restate.key(), transfer);
  Restate.state().set(STATE, state);

  Restate.run(<span class="hljs-string">&quot;withdraw&quot;</span>, () -&gt; wallets.withdraw(transfer.from(), transfer.amount()));
  state = state.withStatus(WITHDRAW_SUCCEEDED);
  Restate.state().set(STATE, state);

  <span class="hljs-comment">// execution will be &#x27;suspended&#x27; (actually dropped)</span>
  <span class="hljs-keyword">if</span> (transfer.amount() &gt;= <span class="hljs-number">200</span>) Restate.sleep(Duration.ofSeconds(<span class="hljs-number">20</span>));

  <span class="hljs-keyword">try</span> {
    Restate.run(<span class="hljs-string">&quot;deposit&quot;</span>, retryPolicy, () -&gt; wallets.deposit(transfer.to(), transfer.amount()));
    state = state.withStatus(COMPLETED);
  } <span class="hljs-keyword">catch</span> (TerminalException e) {
    Restate.run(<span class="hljs-string">&quot;deposit&quot;</span>, () -&gt; wallets.deposit(transfer.from(), transfer.amount()));
    state = state.withStatus(CANCELLED);
  }

  Restate.state().set(STATE, state);
  <span class="hljs-keyword">return</span> state;
}
